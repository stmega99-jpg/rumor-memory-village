version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "RMV_LIVE_BEDROCK_PROBE=${RMV_LIVE_BEDROCK_PROBE:-false}" >> .env.production
        - npm run typecheck
        - npm test
        - npm run lint
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
